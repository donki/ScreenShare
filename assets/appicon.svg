<!--
  Icono de sOC ScreenShare (fuente). Mismo lenguaje que el resto del catalogo (constitucion E.6):
  cuadrado redondeado con degradado indigo #635BF2 -> #2A1CB8, glifo de linea blanco y acento en
  indigo claro #C3C0FF. Una pantalla con el punto de grabar. tools/generar-icono.ps1 lo dibuja a
  appicon.ico (16-256), Assets/logo.png y la variante de la bandeja mientras graba (punto rojo).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#635BF2" />
      <stop offset="1" stop-color="#2A1CB8" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)" />
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="52" width="176" height="118" rx="16" />
    <line x1="128" y1="170" x2="128" y2="198" />
    <line x1="92" y1="204" x2="164" y2="204" />
  </g>
  <circle cx="128" cy="111" r="27" fill="#C3C0FF" />
</svg>
